version: '3.8'
services:
  internetbanking:
    image: panakjsharma72/ib-image
    container_name: ib-container
    ports:
      - "81:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/internetbanking
  mobilebanking:
    image: pankajsharma72/mb-image
    container_name: mb-container
    ports:
      - "82:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/mobilebanking
  insaurance:
    image: pankajsharma72/ins-image
    container_name: ins-container
    ports:
      - "83:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/insaurance
  loans:
    image: pankajsharma72/loans-image
    container_name: loans-cont
    ports:
      - "84:80"
    deploy:
      replicas: 3
    volumes:
      - /var/lib/loan
